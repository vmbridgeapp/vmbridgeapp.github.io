# Build the site from site/build_site.py. site/gen/part* is a gzip+base64
# copy used only when that file is missing. A commit under site/ retriggers
# this workflow. The published HTML does not, because those paths are not
# listed below.

name: Build site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "macos/Sparkle/**"
      - "parallels_mcp/__init__.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Publish when the generator is complete
        env:
          VMBRIDGE_SITE_URL: https://vmbridgeapp.github.io
        run: |
          set -euo pipefail
          if [ ! -f site/build_site.py ]; then
            shopt -s nullglob
            parts=(site/gen/part*)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No site generator in this checkout."
              exit 0
            fi
            cat site/gen/part* | base64 -d | gzip -d > site/build_site.py
          fi
          # Older copies of this generator still say $10. The price is $9.99.
          sed -i 's/\$10/$9.99/g; s/PRICE = "10"/PRICE = "9.99"/' site/build_site.py
          python3 site/apply_checkout.py
          python3 site/build_site.py --out /tmp/vmbridge-site
          python3 - << 'PY'
          import shutil
          from pathlib import Path
          src = Path("/tmp/vmbridge-site")
          dst = Path(".")
          keep = {".git", ".github", "site", "macos", "parallels_mcp", "README.md"}
          for path in src.rglob("*"):
              rel = path.relative_to(src)
              target = dst / rel
              if path.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
          for path in list(dst.rglob("*")):
              rel = path.relative_to(dst)
              if not rel.parts or rel.parts[0] in keep:
                  continue
              if path.is_file() and not (src / rel).is_file():
                  path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site already matches the build."
            exit 0
          fi
          git commit -m "Publish the built site."
          git push
