# Build the site from the generator committed in this repository.
# The generator is stored as gzip+base64 parts under site/gen because a
# text upload cannot carry the binary images, and one contents write is
# easier to retry in pieces. A commit under site/ retriggers this workflow.
# The published HTML does not, because those paths are not listed below.

name: Build site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "macos/Sparkle/**"
      - "parallels_mcp/__init__.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Publish when the generator is complete
        env:
          VMBRIDGE_SITE_URL: https://vmbridgeapp.github.io
        run: |
          set -euo pipefail
          parts=(site/gen/partaa site/gen/partab site/gen/partac site/gen/partad site/gen/partae)
          for part in "${parts[@]}"; do
            if [ ! -f "$part" ]; then
              echo "Waiting for $part before building."
              exit 0
            fi
          done
          cat "${parts[@]}" | base64 -d | gzip -d > site/build_site.py
          python3 site/build_site.py --out /tmp/vmbridge-site
          python3 - << 'PY'
          import shutil
          from pathlib import Path
          src = Path("/tmp/vmbridge-site")
          dst = Path(".")
          keep = {".git", ".github", "site", "macos", "parallels_mcp", "README.md"}
          for path in src.rglob("*"):
              rel = path.relative_to(src)
              target = dst / rel
              if path.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
          for path in list(dst.rglob("*")):
              rel = path.relative_to(dst)
              if not rel.parts or rel.parts[0] in keep:
                  continue
              if path.is_file() and not (src / rel).is_file():
                  path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site already matches the build."
            exit 0
          fi
          git commit -m "Publish the built site."
          git push
